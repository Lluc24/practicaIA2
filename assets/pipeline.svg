<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="320" fill="#fcfcfb" rx="12"/>

  <text x="575" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#52514e">Heuristic classification — from a concrete request to a concrete itinerary</text>

  <!-- Stage boxes: x positions -->
  <!-- Stage 1 -->
  <g>
    <rect x="30" y="90" width="190" height="100" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="125" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Concrete Problem</text>
    <text x="125" y="142" text-anchor="middle" font-size="12" fill="#52514e">Module A</text>
    <text x="125" y="164" text-anchor="middle" font-size="11" fill="#52514e">raw answers from</text>
    <text x="125" y="180" text-anchor="middle" font-size="11" fill="#52514e">the visitor</text>
  </g>

  <path d="M220,140 L262,140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="241" y="128" text-anchor="middle" font-size="10" fill="#898781">abstraction</text>

  <!-- Stage 2 -->
  <g>
    <rect x="262" y="90" width="190" height="100" rx="10" fill="#d3ecdf" stroke="#1baf7a" stroke-width="1.5"/>
    <text x="357" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Abstract Problem</text>
    <text x="357" y="142" text-anchor="middle" font-size="12" fill="#52514e">Module B</text>
    <text x="357" y="164" text-anchor="middle" font-size="11" fill="#52514e">pace, knowledge &amp;</text>
    <text x="357" y="180" text-anchor="middle" font-size="11" fill="#52514e">interest categories</text>
  </g>

  <path d="M452,140 L494,140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="473" y="128" text-anchor="middle" font-size="10" fill="#898781">heuristic</text>
  <text x="473" y="158" text-anchor="middle" font-size="10" fill="#898781">association</text>

  <!-- Stage 3 -->
  <g>
    <rect x="494" y="90" width="190" height="100" rx="10" fill="#faedc7" stroke="#eda100" stroke-width="1.5"/>
    <text x="589" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Abstract Solution</text>
    <text x="589" y="142" text-anchor="middle" font-size="12" fill="#52514e">Module C</text>
    <text x="589" y="164" text-anchor="middle" font-size="11" fill="#52514e">touristic / intellectual</text>
    <text x="589" y="180" text-anchor="middle" font-size="11" fill="#52514e">visit shape &amp; pace</text>
  </g>

  <path d="M684,140 L726,140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="705" y="128" text-anchor="middle" font-size="10" fill="#898781">refinement /</text>
  <text x="705" y="158" text-anchor="middle" font-size="10" fill="#898781">adaptation</text>

  <!-- Stage 4 -->
  <g>
    <rect x="726" y="90" width="190" height="100" rx="10" fill="#e2dcf5" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="821" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Concrete Solution</text>
    <text x="821" y="142" text-anchor="middle" font-size="12" fill="#52514e">Module D</text>
    <text x="821" y="164" text-anchor="middle" font-size="11" fill="#52514e">rooms &amp; artworks,</text>
    <text x="821" y="180" text-anchor="middle" font-size="11" fill="#52514e">day by day</text>
  </g>

  <path d="M916,140 L958,140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="937" y="128" text-anchor="middle" font-size="10" fill="#898781">printing</text>

  <!-- Stage 5 -->
  <g>
    <rect x="958" y="90" width="162" height="100" rx="10" fill="#fbdcdc" stroke="#e34948" stroke-width="1.5"/>
    <text x="1039" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Output</text>
    <text x="1039" y="142" text-anchor="middle" font-size="12" fill="#52514e">Module Imprimir</text>
    <text x="1039" y="164" text-anchor="middle" font-size="11" fill="#52514e">printed</text>
    <text x="1039" y="180" text-anchor="middle" font-size="11" fill="#52514e">itinerary</text>
  </g>

  <text x="575" y="230" text-anchor="middle" font-size="12" fill="#52514e">Each arrow is where combinatorial search would otherwise blow up — replaced here by an expert-authored CLIPS rule.</text>
  <text x="575" y="252" text-anchor="middle" font-size="12" fill="#52514e">This trades global optimality for a fast, explainable, good-enough itinerary.</text>
</svg>
